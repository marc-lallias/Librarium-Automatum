services:
  # ---------------------------------------------------------------------------
  # Ollama – LLM inference server
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest          # use upstream; no custom build needed
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama                 # model weights & runtime data
      - ./ollama/modelfiles:/modelfiles:ro        # ← edit on host, use in container
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - llm-network

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # MongoDB – LibreChat database
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7-jammy
    container_name: chat-mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - llm-network

  # ---------------------------------------------------------------------------
  # Meilisearch – full-text search for LibreChat conversations
  # create user npm run create-user -- marc.lallias@icloud.com marc mlallias --email-verified=false llkkazllkkaz
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: chat-meilisearch
    restart: unless-stopped
    env_file:
      - ./libreChat/.env
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - llm-network

  # ---------------------------------------------------------------------------
  # LibreChat – chat / RAG frontend
  # ---------------------------------------------------------------------------
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: LibreChat
    restart: unless-stopped
    depends_on:
      - mongodb
      - meilisearch
      - ollama
    ports:
      - "${LIBRECHAT_PORT:-3080}:3080"
    env_file:
      - .env                                 # shared defaults
      - ./libreChat/.env                     # app-specific overrides
    volumes:
      - ./libreChat/librechat.yaml:/app/librechat.yaml:ro
      - librechat-uploads:/app/client/public/images
      - librechat-logs:/app/api/logs
    networks:
      - llm-network

